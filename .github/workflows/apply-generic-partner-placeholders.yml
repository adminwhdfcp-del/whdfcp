name: Apply generic partner placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[generic-partner-placeholders]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update partner placeholder styling
        shell: python
        run: |
          from pathlib import Path

          path = Path('partners.html')
          text = path.read_text(encoding='utf-8')

          old = '.partner-text-logo{display:flex;align-items:center;justify-content:center;min-height:72px;padding:12px;font-weight:700;text-align:center;font-size:.9rem}'
          new = '.partner-text-logo{display:flex;align-items:center;justify-content:center;width:76px;height:76px;min-height:0;padding:0;box-sizing:border-box;border-radius:16px;background:#e8f3ff;color:#0645a5;font-size:0;line-height:1}.partner-text-logo::before{content:"✦";font-size:2rem;font-weight:700;line-height:1}'

          if old not in text:
              raise SystemExit('Expected partner-text-logo CSS was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-generic-partner-placeholders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partners.html .github/workflows/apply-generic-partner-placeholders.yml
          git commit -m "Add generic partner placeholders [generic-partner-placeholders]"
          git push
